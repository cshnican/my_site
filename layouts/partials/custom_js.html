<script>
  (function () {
    var about = document.querySelector("#about .article-style p, .wg-about .article-style p");
    if (!about || about.textContent.indexOf("Hi!") !== 0) return;

    about.innerHTML = about.innerHTML.replace("Hi!", '<span id="rotating-greeting">Hi</span>!');
    var el = document.getElementById("rotating-greeting");
    if (!el) return;

    var greetings = ["Hi", "你好", "Hola", "Ei", "Γεια", "Ciao", "Halò", "Merhaba", "Salut", "Hei"];
    var index = 0;

    setInterval(function () {
      index = (index + 1) % greetings.length;
      el.textContent = greetings[index];
    }, 5000);
  })();
</script>
